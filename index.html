<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b10">
<title>McCrack Xbox Dashboard</title>
<style>
:root{--green:#20d46b;--green2:#3bf18a;--white:#f5f7f8;--muted:#c2c8cc;--panel:#0b1019;--focus:#23dc70}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d14;color:var(--white);font-family:"Segoe UI",Arial,sans-serif}body{user-select:none}button{font:inherit;color:inherit;border:0;cursor:pointer}button:focus-visible{outline:3px solid var(--green2);outline-offset:4px}
.shell{position:relative;width:100%;height:100dvh;min-height:540px;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 50% 35%,#24463b 0%,#142b2d 28%,#0b1720 65%,#060a11 100%)}
.bg-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-3;opacity:.52;filter:saturate(.75) brightness(.65);transition:opacity .35s}
.bg-image{position:absolute;inset:0;z-index:-2;background-position:center;background-size:cover;opacity:0;transition:opacity .45s,background-image .25s}
.bg-image:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#060b10b8,transparent 70%),linear-gradient(0deg,#060b10e8 0%,transparent 62%,#05090a66)}
.bg-shade{position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,#03070970 0%,transparent 25%,transparent 60%,#03070966 100%)}
.topbar{position:absolute;top:0;left:0;right:0;height:112px;display:grid;grid-template-columns:minmax(240px,1fr) auto minmax(240px,1fr);align-items:start;padding:23px 34px 0;z-index:5}
.profile{display:flex;align-items:center;gap:13px;justify-self:start;min-width:0;padding:0;background:none;text-align:left}
.avatar{width:52px;height:52px;flex-shrink:0;display:grid;place-items:center;border-radius:50%;font-weight:800;font-size:20px;color:white;background:radial-gradient(circle at 32% 24%,#9bdfba,#2e8067 48%,#143c38);border:2px solid #ffffffc9;box-shadow:0 4px 18px #0006}
.user-name{font-size:16px;font-weight:650;letter-spacing:.15px;text-shadow:0 2px 7px #000a;white-space:nowrap}
.user-logo{display:block;width:66px;height:19px;object-fit:contain;margin-top:5px;filter:drop-shadow(0 2px 6px #000a)}
.top-icons{display:flex;gap:21px;align-items:center;justify-content:center;padding-top:12px}
.top-icon{width:38px;height:38px;object-fit:contain;filter:drop-shadow(0 2px 7px #000a);opacity:.9;transition:transform .16s,opacity .16s;cursor:pointer}
.top-icon:hover,.top-icon.active{transform:translateY(-2px) scale(1.12);opacity:1}
.clock-area{justify-self:end;display:flex;align-items:center;gap:13px;padding:5px 0;text-shadow:0 2px 8px #000c}
.clock-icons{display:flex;align-items:center;gap:10px}.clock-icons img{width:23px;height:23px;object-fit:contain;filter:drop-shadow(0 2px 5px #0009)}
.clock{font-size:26px;font-weight:300;letter-spacing:.6px;white-space:nowrap}
.content{position:absolute;inset:100px 0 0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:0 28px 28px}
.selection-label{position:absolute;left:5.5%;bottom:calc(28px + 265px);max-width:35%;opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s;pointer-events:none;text-shadow:0 2px 12px #000c}
.selection-label.visible{opacity:1;transform:none}.selection-label .eyebrow{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:#b8f8d0;margin-bottom:7px}.selection-label h1{font-size:clamp(24px,3vw,42px);line-height:1.06;font-weight:350;letter-spacing:-1.2px;margin:0 0 8px}.selection-label p{font-size:13px;color:#e0e7e5;margin:0;line-height:1.45}
.game-grid{width:min(1110px,100%);display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:clamp(8px,1.15vw,17px);align-items:end;justify-content:center}
.game-card{position:relative;aspect-ratio: .69;min-width:0;overflow:hidden;border-radius:2px;padding:0;background:#16232a;box-shadow:0 5px 20px #0008;transform:translateZ(0);transition:transform .2s,box-shadow .2s,filter .2s;isolation:isolate}
.game-card:before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(0deg,#03070be8,transparent 42%),linear-gradient(135deg,#ffffff0b,transparent 55%);pointer-events:none}
.game-card img{width:100%;height:100%;display:block;object-fit:cover;transition:transform .35s,filter .2s}
.game-card .game-name{position:absolute;z-index:2;left:8px;right:6px;bottom:9px;text-align:left;font-size:clamp(9px,.83vw,12px);font-weight:650;line-height:1.2;text-shadow:0 2px 5px #000;opacity:0;transform:translateY(5px);transition:opacity .15s,transform .15s}
.game-card.selected,.game-card:focus-visible{transform:translateY(-13px) scale(1.075);z-index:3;box-shadow:0 0 0 3px #f4fff8,0 0 0 5px #1ed760,0 16px 35px #000b}
.game-card.selected img,.game-card:focus-visible img{transform:scale(1.035)}
.game-card.selected .game-name,.game-card:focus-visible .game-name{opacity:1;transform:none}
.game-card:not(.selected):hover{transform:translateY(-6px) scale(1.025);z-index:2}
.rectangle-row{width:min(1450px,100%);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(10px,1.4vw,20px);margin-top:28px}
.rectangle-card{height:clamp(112px,18.5vh,190px);min-width:0;position:relative;overflow:hidden;border-radius:2px;padding:0;background:#15252c;background-size:cover;background-position:center;box-shadow:0 5px 19px #0008;text-align:left;transition:transform .18s,box-shadow .18s;isolation:isolate}
.rectangle-card:before{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(0deg,#030609e8 0%,#03060928 70%),linear-gradient(135deg,#07110b33,transparent)}
.rectangle-card p{position:absolute;left:14px;right:10px;bottom:13px;margin:0;font-size:clamp(11px,1vw,15px);line-height:1.25;font-weight:650;text-shadow:0 2px 6px #000}
.rectangle-card.selected,.rectangle-card:focus-visible{transform:translateY(-7px) scale(1.025);z-index:2;box-shadow:0 0 0 3px #f4fff8,0 0 0 5px #1ed760,0 15px 35px #000b}
.rectangle-card:hover:not(.selected){transform:translateY(-4px)}
.hintbar{position:absolute;bottom:0;left:0;right:0;height:25px;display:flex;align-items:center;gap:18px;padding:0 24px;color:#d6dfdc;font-size:10px;background:linear-gradient(90deg,#03070988,#03070935);text-shadow:0 1px 4px #000;z-index:4}
.hint{display:flex;align-items:center;gap:6px;white-space:nowrap}.key{width:16px;height:16px;border-radius:50%;display:inline-grid;place-items:center;background:#e7ece9;color:#121b18;font-size:9px;font-weight:800;text-shadow:none}
.hint-right{margin-left:auto;color:#d6dfdc}
.cursor-dot{position:fixed;left:0;top:0;width:13px;height:13px;border-radius:50%;background:#24e66d;box-shadow:0 0 14px 4px #24e66d99;transform:translate(-50%,-50%);z-index:99;pointer-events:none;opacity:0;transition:opacity .15s}
.toast{position:absolute;right:24px;top:92px;z-index:20;padding:13px 17px;background:#f2f7f4;color:#102219;font-size:13px;box-shadow:0 8px 30px #0008;opacity:0;transform:translateY(-8px);transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:none}
@media(max-width:1000px){.topbar{grid-template-columns:1fr auto 1fr;padding:18px 22px 0}.avatar{width:43px;height:43px}.user-name{font-size:14px}.top-icons{gap:12px}.top-icon{width:31px;height:31px}.clock{font-size:22px}.game-grid{grid-template-columns:repeat(9,minmax(0,1fr));gap:7px}.rectangle-row{margin-top:21px}.rectangle-card{height:clamp(100px,16vh,150px)}.selection-label{left:3%;bottom:calc(28px + 225px)}}
@media(max-width:700px){.shell{min-height:480px}.topbar{height:82px;padding:13px 13px 0;grid-template-columns:1fr auto;align-items:start}.profile{gap:8px}.avatar{width:36px;height:36px;font-size:15px}.user-name{font-size:12px}.user-logo{width:52px;height:14px;margin-top:2px}.top-icons{position:absolute;top:62px;left:0;right:0;padding:0;gap:18px}.top-icon{width:25px;height:25px}.clock-area{gap:7px}.clock-icons{gap:4px}.clock-icons img{width:17px;height:17px}.clock{font-size:19px}.content{inset:90px 0 0;padding:0 11px 28px;justify-content:flex-end}.game-grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;width:100%}.game-card{aspect-ratio:.78}.game-card:nth-child(n+6){display:none}.game-card .game-name{font-size:9px;left:5px;bottom:5px}.game-card.selected{transform:translateY(-6px) scale(1.04)}.rectangle-row{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:15px}.rectangle-card{height:clamp(75px,12vh,110px)}.rectangle-card p{font-size:10px;left:8px;bottom:8px}.selection-label{display:none}.hintbar{height:24px;padding:0 9px;gap:10px;font-size:9px}.hint:nth-child(3){display:none}.hint-right{font-size:8px}}
@media(max-height:680px) and (min-width:701px){.topbar{height:90px;padding-top:14px}.content{padding-bottom:24px}.game-grid{width:min(950px,100%)}.game-card{aspect-ratio:.73}.rectangle-row{margin-top:15px}.rectangle-card{height:clamp(78px,15vh,125px)}.selection-label{bottom:calc(24px + 180px)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="shell" id="shell">
<video class="bg-video" id="bgVideo" autoplay muted loop playsinline poster="https://raw.githubusercontent.com/PedroWilsonRL/xboxone-dashboard/main/src/assets/game-list/game-background/Forza-Horizon-5.jpg"><source src="https://raw.githubusercontent.com/PedroWilsonRL/xboxone-dashboard/main/src/assets/Animated-Background/PlayStation%205%20-%20Menu%20Background%20with%20particles.mp4" type="video/mp4"></video>
<div class="bg-image" id="bgImage"></div><div class="bg-shade"></div>
<header class="topbar">
<button class="profile" id="profileButton" aria-label="Open profile"><span class="avatar">P</span><span><span class="user-name">Patrick_Mango</span><img class="user-logo" src="https://raw.githubusercontent.com/PedroWilsonRL/xboxone-dashboard/main/src/assets/Icons/logo%20ultimate.png" alt="Game Pass Ultimate"></span></button>
<nav class="top-icons" aria-label="Dashboard shortcuts">
<img class="top-icon" tabindex="0" role="button" data-shortcut="Home" src="https://raw.githubusercontent.com/PedroWilsonRL/xboxone-dashboard/main/src/assets/Icons/icon1.png" alt="Home" title="Home">
<img class="top-icon" tabindex="0" role="button" data-shortcut="Community" src="https://raw.githubusercontent.com/PedroWilsonRL/xboxone-dashboard/main/src/assets/Icons/icon2.png" alt="Community" title="Community">
<img class="top-icon" tabindex="0" role="button" data-shortcut="Capture" src="https://raw.githubusercontent.com/PedroWilsonRL/xboxone-dashboard/main/src/assets/Icons/icon3.png" alt="Capture" title="Capture">
<img class="top-icon" tabindex="0" role="button" data-shortcut="Settings" src="https://raw.githubusercontent.com/PedroWilsonRL/xboxone-dashboard/main/src/assets/Icons/icon4.png" alt="Settings" title="Settings">
<img class="top-icon" tabindex="0" role="button" data-shortcut="Notifications" src="https://raw.githubusercontent.com/PedroWilsonRL/xboxone-dashboard/main/src/assets/Icons/icon5.png" alt="Notifications" title="Notifications">
</nav>
<div class="clock-area"><div class="clock-icons"><img src="https://raw.githubusercontent.com/PedroWilsonRL/xboxone-dashboard/main/src/assets/Icons/icon%20charging.png" alt="Battery"><img src="https://raw.githubusercontent.com/PedroWilsonRL/xboxone-dashboard/main/src/assets/Icons/microfone2.png" alt="Microphone"></div><div class="clock" id="clock">--:--</div></div>
</header>
<main class="content">
<div class="selection-label" id="selectionLabel"><div class="eyebrow" id="selectedType">Recently played</div><h1 id="selectedTitle">Forza Horizon 5</h1><p id="selectedDescription">Choose a game to preview its artwork.</p></div>
<div class="game-grid" id="gameGrid" aria-label="Recently played games">
<button class="game-card" data-id="deadrising" data-title="Dead Rising 3: Apocalypse Edition" data-background="Dead-Rising-3-Apocalypse-Edition.jpg" data-description="Survive the zombie outbreak in Los Perdidos." aria-label="Dead Rising 3: Apocalypse Edition"><img loading="eager" src="https://raw.githubusercontent.com/PedroWilsonRL/xboxone-dashboard/main/src/assets/game-list/game-cover/Dead-Rising-3-Apocalypse-Edition.jpg" alt=""><span class="game-name">Dead Rising 3</span></button>
<button class="game-card" data-id="forza" data-title="Forza Horizon 5" data-background="Forza-Horizon-5.jpg" data-description="Race through the vibrant landscapes of Mexico." aria-label="Forza Horizon 5"><img loading="eager" src="https://raw.githubusercontent.com/PedroWilsonRL/xboxone-dashboard/main/src/assets/game-list/game-cover/Forza-Horizon-5.jpg" alt=""><span class="game-name">Forza Horizon 5</span></button>
<button class="game-card" data-id="halo" data-title="Halo 5: Guardians" data-background="Halo-5-Guardians.jpg" data-description="Join the fight to save humanity." aria-label="Halo 5: Guardians"><img loading="eager" src="https://raw.githubusercontent.com/PedroWilsonRL/xboxone-dashboard/main/src/assets/game-list/game-cover/Halo-5-Guardians.jpg" alt=""><span class="game-name">Halo 5: Guardians</span></button>
<button class="game-card" data-id="gta" data-title="Grand Theft Auto V" data-background="Grand-Theft-Auto-V.jpg" data-description="Explore Los Santos and Blaine County." aria-label="Grand Theft Auto V"><img loading="eager" src="https://raw.githubusercontent.com/PedroWilsonRL/xboxone-dashboard/main/src/assets/game-list/game-cover/Grand-Theft-Auto-V.jpg" alt=""><span class="game-name">Grand Theft Auto V</span></button>
<button class="game-card" data-id="souls" data-title="Dark Souls III: Deluxe Edition" data-background="Dark-Souls-III-Deluxe-Edition.jpg" data-description="Face formidable foes in a dark fantasy world." aria-label="Dark Souls III: Deluxe Edition"><img loading="eager" src="https://raw.githubusercontent.com/PedroWilsonRL/xboxone-dashboard/main/src/assets/game-list/game-cover/Dark-Souls-III-Deluxe-Edition.jpg" alt=""><span class="game-name">Dark Souls III</span></button>
<button class="game-card" data-id="minecraft" data-title="Minecraft: Xbox One Edition" data-background="Minecraft.jpg" data-description="Build, explore, and create your own world." aria-label="Minecraft: Xbox One Edition"><img loading="eager" src="https://raw.githubusercontent.com/PedroWilsonRL/xboxone-dashboard/main/src/assets/game-list/game-cover/Minecraft.jpg" alt=""><span class="game-name">Minecraft</span></button>
<button class="game-card" data-id="kingdom" data-title="Kingdom Hearts II" data-background="Kingdom-Hearts-II.jpg" data-description="Adventure across worlds in a classic action RPG." aria-label="Kingdom Hearts II"><img loading="eager" src="https://raw.githubusercontent.com/PedroWilsonRL/xboxone-dashboard/main/src/assets/game-list/game-cover/Kingdom-Hearts-II.jpg" alt=""><span class="game-name">Kingdom Hearts II</span></button>
<button class="game-card" data-id="witcher" data-title="The Witcher III: Complete Edition" data-background="The-Witcher-3-Complete-Edition.jpg" data-description="Track monsters and shape your own adventure." aria-label="The Witcher III: Complete Edition"><img loading="eager" src="https://raw.githubusercontent.com/PedroWilsonRL/xboxone-dashboard/main/src/assets/game-list/game-cover/The-Witcher-3-Complete-Edition.jpg" alt=""><span class="game-name">The Witcher III</span></button>
<button class="game-card" data-id="paladins" data-title="Paladins" data-background="Paladins.jpg" data-description="Choose your champion and join the battle." aria-label="Paladins"><img loading="eager" src="https://raw.githubusercontent.com/PedroWilsonRL/xboxone-dashboard/main/src/assets/game-list/game-cover/Paladins.jpg" alt=""><span class="game-name">Paladins</span></button>
</div>
<div class="rectangle-row" id="rectangleRow" aria-label="Dashboard tiles">
<button class="rectangle-card" data-id="browse" data-title="Browse your games" data-background="Browse-Your-Games.jpg" data-description="See your full collection and find your next game." style="background-image:url('https://raw.githubusercontent.com/PedroWilsonRL/xboxone-dashboard/main/src/assets/Browse-Your-Games.jpg')"><p>Browse your games</p></button>
<button class="rectangle-card" data-id="pass" data-title="Get free access to several games" data-background="Game-Pass.jpg" data-description="Explore a growing library of games." style="background-image:url('https://raw.githubusercontent.com/PedroWilsonRL/xboxone-dashboard/main/src/assets/Game-Pass.jpg')"><p>Get free access to several games</p></button>
<button class="rectangle-card" data-id="spotify" data-title="Choose your audio while gaming" data-background="Spotify.jpg" data-description="Keep your favorite soundtrack close while you play." style="background-image:url('https://raw.githubusercontent.com/PedroWilsonRL/xboxone-dashboard/main/src/assets/Spotify.jpg')"><p>Choose your audio while gaming</p></button>
<button class="rectangle-card" data-id="xboxlive" data-title="Play online with your friends" data-background="Xbox-Live.jpg" data-description="Connect with friends and play together." style="background-image:url('https://raw.githubusercontent.com/PedroWilsonRL/xboxone-dashboard/main/src/assets/Xbox-Live.jpg')"><p>Play online with your friends</p></button>
</div>
</main>
<div class="hintbar"><span class="hint"><span class="key">A</span> Select</span><span class="hint"><span class="key">B</span> Back</span><span class="hint"><span class="key">☰</span> Options</span><span class="hint-right">McCrack Xbox · Dashboard concept</span></div>
<div class="toast" id="toast" role="status"></div><div class="cursor-dot" id="cursorDot"></div>
</div>
<script>
(()=> {
const base='https://raw.githubusercontent.com/PedroWilsonRL/xboxone-dashboard/main/src/assets/';
const cards=[...document.querySelectorAll('.game-card,.rectangle-card')];
const bg=document.getElementById('bgImage'),video=document.getElementById('bgVideo'),label=document.getElementById('selectionLabel');
const title=document.getElementById('selectedTitle'),desc=document.getElementById('selectedDescription'),type=document.getElementById('selectedType');
const toast=document.getElementById('toast');let selected=-1,toastTimer;
function showToast(message){toast.textContent=message;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1800)}
function selectCard(card,focus=false){const index=cards.indexOf(card);selected=index;cards.forEach(c=>c.classList.toggle('selected',c===card));const name=card.dataset.background;bg.style.backgroundImage='url("'+base+(card.classList.contains('game-card')?'game-list/game-background/':'')+encodeURIComponent(name).replace(/%2F/g,'/')+'")';bg.style.opacity='1';video.style.opacity='.06';title.textContent=card.dataset.title;desc.textContent=card.dataset.description;type.textContent=card.classList.contains('game-card')?'Recently played':'Dashboard';label.classList.add('visible');if(focus)card.focus({preventScroll:true});}
function clearSelection(){selected=-1;cards.forEach(c=>c.classList.remove('selected'));bg.style.opacity='0';video.style.opacity='.52';label.classList.remove('visible')}
cards.forEach((card,i)=>{card.addEventListener('click',e=>{e.stopPropagation();if(selected===i){selectCard(card)}else selectCard(card)});card.addEventListener('mouseenter',()=>{if(selected===-1){title.textContent=card.dataset.title;desc.textContent=card.dataset.description;type.textContent=card.classList.contains('game-card')?'Recently played':'Dashboard';label.classList.add('visible')}});card.addEventListener('focus',()=>{if(selected!==i)selectCard(card)})});
document.getElementById('shell').addEventListener('click',e=>{if(!e.target.closest('.game-card,.rectangle-card,.top-icon,.profile'))clearSelection()});
document.querySelectorAll('[data-shortcut]').forEach((icon,i)=>{const activate=()=>{document.querySelectorAll('.top-icon').forEach(x=>x.classList.remove('active'));icon.classList.add('active');showToast(({Home:'Home dashboard',Community:'Community is ready to connect',Capture:'Capture & share',Settings:'Dashboard settings',Notifications:'You’re all caught up'})[icon.dataset.shortcut]||icon.dataset.shortcut)};icon.addEventListener('click',activate);icon.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();activate()}})});
document.getElementById('profileButton').addEventListener('click',()=>showToast('Signed in as Patrick_Mango'));
function updateClock(){document.getElementById('clock').textContent=new Intl.DateTimeFormat(undefined,{hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date())}updateClock();setInterval(updateClock,15000);
document.addEventListener('keydown',e=>{const active=document.activeElement;const arrows=['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'];if(arrows.includes(e.key)){e.preventDefault();let next=selected<0?0:selected;if(e.key==='ArrowLeft')next=Math.max(0,next-1);if(e.key==='ArrowRight')next=Math.min(cards.length-1,next+1);if(e.key==='ArrowUp')next=Math.max(0,next-9);if(e.key==='ArrowDown')next=Math.min(cards.length-1,next+9);selectCard(cards[next],true)}if(e.key==='Escape'||e.key.toLowerCase()==='b'){clearSelection()}if(e.key==='Enter'&&(active.classList.contains('game-card')||active.classList.contains('rectangle-card'))){selectCard(active)}if(e.key.toLowerCase()==='a'&&selected>=0)selectCard(cards[selected])});
const dot=document.getElementById('cursorDot');document.addEventListener('mousemove',e=>{dot.style.left=e.clientX+'px';dot.style.top=e.clientY+'px';dot.style.opacity='1'});document.addEventListener('mouseleave',()=>dot.style.opacity='0');document.addEventListener('mousedown',()=>dot.style.transform='translate(-50%,-50%) scale(.78)');document.addEventListener('mouseup',()=>dot.style.transform='translate(-50%,-50%) scale(1)');
document.querySelectorAll('img').forEach(img=>img.addEventListener('error',()=>{if(img.classList.contains('top-icon'))img.style.display='none'}));
})();
</script>
</body></html>
