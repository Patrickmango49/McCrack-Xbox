<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070b10">
<title>McCrack Xbox Dashboard</title>
<style>
:root{--green:#20d46b;--green2:#3bf18a;--white:#f5f7f8;--muted:#c2c8cc;--panel:#0b1019;--focus:#23dc70}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d14;color:var(--white);font-family:"Segoe UI",Arial,sans-serif}body{user-select:none}button{font:inherit;color:inherit;border:0;cursor:pointer}button:focus-visible{outline:3px solid var(--green2);outline-offset:4px}
.shell{position:relative;width:100%;height:100dvh;min-height:540px;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 50% 35%,#24463b 0%,#142b2d 28%,#0b1720 65%,#060a11 100%)}
.bg-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-3;opacity:.52;filter:saturate(.75) brightness(.65);transition:opacity .35s}
.bg-image{position:absolute;inset:0;z-index:-2;background-position:center;background-size:cover;opacity:0;transition:opacity .45s,background-image .25s}
.bg-image:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#060b10b8,transparent 70%),linear-gradient(0deg,#060b10e8 0%,transparent 62%,#05090a66)}
.bg-shade{position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,#03070970 0%,transparent 25%,transparent 60%,#03070966 100%)}
.topbar{position:absolute;top:0;left:0;right:0;height:112px;display:grid;grid-template-columns:minmax(240px,1fr) auto minmax(240px,1fr);align-items:start;padding:23px 34px 0;z-index:5}
.profile{display:flex;align-items:center;gap:13px;justify-self:start;min-width:0;padding:0;background:none;text-align:left}
.avatar{width:52px;height:52px;flex-shrink:0;display:grid;place-items:center;border-radius:50%;font-weight:800;font-size:20px;color:white;background:radial-gradient(circle at 32% 24%,#9bdfba,#2e8067 48%,#143c38);border:2px solid #ffffffc9;box-shadow:0 4px 18px #0006}
.user-name{font-size:16px;font-weight:650;letter-spacing:.15px;text-shadow:0 2px 7px #000a;white-space:nowrap}
.user-logo{display:block;width:66px;height:19px;object-fit:contain;margin-top:5px;filter:drop-shadow(0 2px 6px #000a)}
.top-icons{display:flex;gap:21px;align-items:center;justify-content:center;padding-top:12px}
.top-icon{width:38px;height:38px;object-fit:contain;filter:drop-shadow(0 2px 7px #000a);opacity:.9;transition:transform .16s,opacity .16s;cursor:pointer}
.top-icon:hover,.top-icon.active{transform:translateY(-2px) scale(1.12);opacity:1}
.clock-area{justify-self:end;display:flex;align-items:center;gap:13px;padding:5px 0;text-shadow:0 2px 8px #000c}
.clock-icons{display:flex;align-items:center;gap:10px}.clock-icons img{width:23px;height:23px;object-fit:contain;filter:drop-shadow(0 2px 5px #0009)}
.clock{font-size:26px;font-weight:300;letter-spacing:.6px;white-space:nowrap}
.content{position:absolute;inset:100px 0 0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:0 28px 28px}
.selection-label{position:absolute;left:5.5%;bottom:calc(28px + 265px);max-width:35%;opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s;pointer-events:none;text-shadow:0 2px 12px #000c}
.selection-label.visible{opacity:1;transform:none}.selection-label .eyebrow{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:#b8f8d0;margin-bottom:7px}.selection-label h1{font-size:clamp(24px,3vw,42px);line-height:1.06;font-weight:350;letter-spacing:-1.2px;margin:0 0 8px}.selection-label p{font-size:13px;color:#e0e7e5;margin:0;line-height:1.45}
.game-grid{width:min(1110px,100%);display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:clamp(8px,1.15vw,17px);align-items:end;justify-content:center}
.game-card{position:relative;aspect-ratio: .69;min-width:0;overflow:hidden;border-radius:2px;padding:0;background:#16232a;box-shadow:0 5px 20px #0008;transform:translateZ(0);transition:transform .2s,box-shadow .2s,filter .2s;isolation:isolate}
.game-card:before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(0deg,#03070be8,transparent 42%),linear-gradient(135deg,#ffffff0b,transparent 55%);pointer-events:none}
.game-card img{width:100%;height:100%;display:block;object-fit:cover;transition:transform .35s,filter .2s}
.game-card .game-name{position:absolute;z-index:2;left:8px;right:6px;bottom:9px;text-align:left;font-size:clamp(9px,.83vw,12px);font-weight:650;line-height:1.2;text-shadow:0 2px 5px #000;opacity:0;transform:translateY(5px);transition:opacity .15s,transform .15s}
.game-card.selected,.game-card:focus-visible{transform:translateY(-13px) scale(1.075);z-index:3;box-shadow:0 0 0 3px #f4fff8,0 0 0 5px #1ed760,0 16px 35px #000b}
.game-card.selected img,.game-card:focus-visible img{transform:scale(1.035)}
.game-card.selected .game-name,.game-card:focus-visible .game-name{opacity:1;transform:none}
.game-card:not(.selected):hover{transform:translateY(-6px) scale(1.025);z-index:2}
.rectangle-row{width:min(1450px,100%);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(10px,1.4vw,20px);margin-top:28px}
.rectangle-card{height:clamp(112px,18.5vh,190px);min-width:0;position:relative;overflow:hidden;border-radius:2px;padding:0;background:#15252c;background-size:cover;background-position:center;box-shadow:0 5px 19px #0008;text-align:left;transition:transform .18s,box-shadow .18s;isolation:isolate}
.rectangle-card:before{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(0deg,#030609e8 0%,#03060928 70%),linear-gradient(135deg,#07110b33,transparent)}
.rectangle-card p{position:absolute;left:14px;right:10px;bottom:13px;margin:0;font-size:clamp(11px,1vw,15px);line-height:1.25;font-weight:650;text-shadow:0 2px 6px #000}
.rectangle-card.selected,.rectangle-card:focus-visible{transform:translateY(-7px) scale(1.025);z-index:2;box-shadow:0 0 0 3px #f4fff8,0 0 0 5px #1ed760,0 15px 35px #000b}
.rectangle-card:hover:not(.selected){transform:translateY(-4px)}
.hintbar{position:absolute;bottom:0;left:0;right:0;height:25px;display:flex;align-items:center;gap:18px;padding:0 24px;color:#d6dfdc;font-size:10px;background:linear-gradient(90deg,#03070988,#03070935);text-shadow:0 1px 4px #000;z-index:4}
.hint{display:flex;align-items:center;gap:6px;white-space:nowrap}.key{width:16px;height:16px;border-radius:50%;display:inline-grid;place-items:center;background:#e7ece9;color:#121b18;font-size:9px;font-weight:800;text-shadow:none}
.hint-right{margin-left:auto;color:#d6dfdc}
.cursor-dot{position:fixed;left:0;top:0;width:13px;height:13px;border-radius:50%;background:#24e66d;box-shadow:0 0 14px 4px #24e66d99;transform:translate(-50%,-50%);z-index:99;pointer-events:none;opacity:0;transition:opacity .15s}
.toast{position:absolute;right:24px;top:92px;z-index:20;padding:13px 17px;background:#f2f7f4;color:#102219;font-size:13px;box-shadow:0 8px 30px #0008;opacity:0;transform:translateY(-8px);transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:none}
@media(max-width:1000px){.topbar{grid-template-columns:1fr auto 1fr;padding:18px 22px 0}.avatar{width:43px;height:43px}.user-name{font-size:14px}.top-icons{gap:12px}.top-icon{width:31px;height:31px}.clock{font-size:22px}.game-grid{grid-template-columns:repeat(9,minmax(0,1fr));gap:7px}.rectangle-row{margin-top:21px}.rectangle-card{height:clamp(100px,16vh,150px)}.selection-label{left:3%;bottom:calc(28px + 225px)}}
@media(max-width:700px){.shell{min-height:480px}.topbar{height:82px;padding:13px 13px 0;grid-template-columns:1fr auto;align-items:start}.profile{gap:8px}.avatar{width:36px;height:36px;font-size:15px}.user-name{font-size:12px}.user-logo{width:52px;height:14px;margin-top:2px}.top-icons{position:absolute;top:62px;left:0;right:0;padding:0;gap:18px}.top-icon{width:25px;height:25px}.clock-area{gap:7px}.clock-icons{gap:4px}.clock-icons img{width:17px;height:17px}.clock{font-size:19px}.content{inset:90px 0 0;padding:0 11px 28px;justify-content:flex-end}.game-grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;width:100%}.game-card{aspect-ratio:.78}.game-card:nth-child(n+6){display:none}.game-card .game-name{font-size:9px;left:5px;bottom:5px}.game-card.selected{transform:translateY(-6px) scale(1.04)}.rectangle-row{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:15px}.rectangle-card{height:clamp(75px,12vh,110px)}.rectangle-card p{font-size:10px;left:8px;bottom:8px}.selection-label{display:none}.hintbar{height:24px;padding:0 9px;gap:10px;font-size:9px}.hint:nth-child(3){display:none}.hint-right{font-size:8px}}
@media(max-height:680px) and (min-width:701px){.topbar{height:90px;padding-top:14px}.content{padding-bottom:24px}.game-grid{width:min(950px,100%)}.game-card{aspect-ratio:.73}.rectangle-row{margin-top:15px}.rectangle-card{height:clamp(78px,15vh,125px)}.selection-label{bottom:calc(24px + 180px)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}

/* McCrack Xbox: interaction layer */
.profile-name{transition:color .2s}.profile:hover .profile-name{color:var(--green2)}
.game-card,.rectangle-card,.top-icon,.profile{transition:transform .2s ease,filter .2s ease,outline-color .2s ease,box-shadow .2s ease}
.game-card.selected{transform:translateY(-9px) scale(1.045);box-shadow:0 12px 34px #0009,0 0 0 2px var(--green2),0 0 24px #20d46b55;z-index:2}
.rectangle-card.selected{transform:translateY(-5px);box-shadow:0 0 0 3px var(--green2),0 12px 34px #0009}
.top-icon.active{filter:drop-shadow(0 0 8px #20d46b)}
.modal-backdrop{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:#020609bd;backdrop-filter:blur(14px);padding:22px}
.modal-backdrop.open{display:flex;animation:modalFade .18s ease-out}
.modal{width:min(570px,100%);max-height:min(690px,90%);overflow:auto;background:linear-gradient(145deg,#17252bfa,#080d14fa);border:1px solid #ffffff28;border-radius:18px;padding:26px;box-shadow:0 24px 100px #000b}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}
.modal h2{font-size:25px;font-weight:650;margin:0}.modal p{color:#b8c4c9;line-height:1.5}.modal-close{background:#ffffff12;border:1px solid #ffffff24;border-radius:10px;width:38px;height:38px;font-size:22px}
.modal-label{display:block;color:#c8d2d6;font-size:13px;margin:18px 0 8px}
.modal input,.modal select{width:100%;padding:12px 13px;background:#05090dcc;color:white;border:1px solid #ffffff2a;border-radius:9px;font:inherit;outline:none}
.modal input:focus,.modal select:focus{border-color:var(--green2);box-shadow:0 0 0 3px #20d46b25}
.modal-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.xbtn{padding:11px 15px;border-radius:9px;background:#ffffff12;border:1px solid #ffffff25;font-weight:600}
.xbtn.primary{background:var(--green);color:#031108;border-color:transparent}
.setting-row{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:14px 0;border-bottom:1px solid #ffffff15}
.setting-row small{display:block;color:#aebbc0;margin-top:4px}
.achievement-list{display:grid;gap:10px;margin-top:15px}
.achievement{display:flex;align-items:center;gap:12px;padding:12px;background:#ffffff08;border:1px solid #ffffff12;border-radius:10px}
.achievement-icon{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:#20d46b1c;color:var(--green2);font-size:21px}
.achievement strong{display:block}.achievement small{color:#aebbc0}
.modal .score{font-size:14px;color:var(--green2);font-weight:700}
.controller-pill{position:fixed;left:50%;bottom:58px;transform:translateX(-50%);z-index:25;background:#080d14df;border:1px solid #ffffff22;border-radius:30px;padding:8px 14px;color:#d9e1e4;font-size:12px;display:none;white-space:nowrap;backdrop-filter:blur(10px)}
.controller-pill.show{display:block;animation:modalFade .2s ease-out}
@keyframes modalFade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.reduce-dashboard-motion .game-card,.reduce-dashboard-motion .rectangle-card,.reduce-dashboard-motion .top-icon,.reduce-dashboard-motion .profile,.reduce-dashboard-motion .bg-image{transition:none!important;animation:none!important}@media(prefers-reduced-motion:reduce){.game-card,.rectangle-card,.top-icon,.profile{transition:none}.modal-backdrop.open{animation:none}}


.modal-backdrop{overflow:auto}.modal.wide{width:min(1120px,100%);max-height:92vh;padding:24px}.page-subtitle{color:#aebdc2;line-height:1.55;margin:6px 0 20px}.page-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:15px;flex-wrap:wrap;margin-bottom:20px}.page-heading h3{font-size:24px;margin:0}.page-tools{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 20px}.page-tools input,.page-tools select,.field-input,.field-area,.field-select{background:#071015;color:#f5f7f8;border:1px solid #ffffff27;border-radius:9px;padding:11px 12px;font:inherit;min-width:0}.page-tools input{flex:1;min-width:170px}.page-tabs{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 18px;border-bottom:1px solid #ffffff1c;padding-bottom:12px}.page-tab{padding:9px 14px;background:#ffffff0c;border:1px solid #ffffff18;border-radius:9px;color:#c8d3d7}.page-tab.active{background:var(--green);color:#04120a;font-weight:750}.library-layout{display:grid;grid-template-columns:155px minmax(0,1fr);gap:18px}.library-side{border-right:1px solid #ffffff18;padding-right:12px}.library-side button{width:100%;text-align:left;padding:10px 8px;background:transparent;border-radius:8px;color:#c2cdd1;margin-bottom:4px}.library-side button.active{background:#20d46b22;color:var(--green2)}.library-count{font-size:12px;color:#93a3a9;margin:8px 0 14px}.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:12px}.media-card{min-width:0;text-align:left;overflow:hidden;border:1px solid #ffffff16;border-radius:11px;background:#ffffff08;padding:0;transition:transform .18s,border-color .18s}.media-card:hover{transform:translateY(-3px);border-color:var(--green2)}.media-art{height:140px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;padding:12px;text-align:center;background:linear-gradient(145deg,#1b4337,#0c1721);position:relative;overflow:hidden}.media-art img{width:100%;height:100%;position:absolute;inset:0;object-fit:cover}.art-icon{font-size:34px;z-index:1}.art-label{font-size:11px;letter-spacing:1px;text-transform:uppercase;z-index:1}.media-meta{padding:10px 11px 12px}.media-meta strong{display:block;font-size:13px;line-height:1.35;min-height:32px}.media-meta small{display:block;color:#a7b7bc;margin-top:6px}.media-badge,.game-tag{display:inline-block;font-size:10px;background:#20d46b1d;color:var(--green2);border:1px solid #20d46b36;border-radius:6px;padding:4px 6px;margin-top:8px}.empty-state{border:1px dashed #ffffff28;border-radius:12px;padding:25px;text-align:center;color:#b7c3c8;grid-column:1/-1}.page-btn{padding:10px 14px;background:#ffffff10;border:1px solid #ffffff22;border-radius:9px;font-weight:600}.page-btn.primary{background:var(--green);color:#06120a}.page-btn.danger{color:#ffb3b3}.profile-hero{height:170px;border-radius:14px;background:linear-gradient(115deg,#1a573e,#152e4e 55%,#090e18);background-size:cover;background-position:center;margin-bottom:-40px}.profile-head{display:flex;align-items:flex-end;gap:14px;padding:0 18px;position:relative}.profile-avatar-large{width:82px;height:82px;border:4px solid #0b1117;border-radius:50%;background:linear-gradient(145deg,#4dbf87,#194c43);background-size:cover;background-position:center;display:grid;place-items:center;font-size:32px;font-weight:800}.profile-head h3{margin:0 0 5px;font-size:24px}.profile-head p{margin:0 0 9px;color:#b7c6cb}.profile-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:18px 0}.stat-card,.settings-card{background:#ffffff07;border:1px solid #ffffff18;border-radius:11px;padding:13px;min-width:0}.stat-card strong{font-size:20px;display:block}.stat-card small,.inline-note{color:#9eafb5;font-size:12px;line-height:1.5}.profile-editor,.settings-grid,.community-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin-top:18px}.field-group{display:flex;flex-direction:column;gap:7px;min-width:0}.field-group.full{grid-column:1/-1}.field-group label,.settings-row label{font-size:12px;color:#c3cfd3}.field-input,.field-select,.field-area{width:100%}.field-area{min-height:80px;resize:vertical}.settings-card h4{margin:0 0 12px}.settings-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid #ffffff12}.settings-row:first-of-type{border-top:0}.settings-row input[type=checkbox]{accent-color:var(--green);width:18px;height:18px}.settings-row select{max-width:155px;background:#071015;color:white;border:1px solid #ffffff25;padding:7px;border-radius:8px}.modal-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}.embed-frame{width:100%;height:min(62vh,550px);min-height:300px;border:1px solid #ffffff20;border-radius:12px;background:#070b10}.demo-video{width:100%;max-height:60vh;background:#000;border-radius:12px}.friend-row,.notification-row{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid #ffffff12}.friend-avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#246f55,#23364e);font-weight:800}.friend-row small{display:block;color:#a9b8bd;margin-top:4px}.notification-row{padding:13px;border-radius:10px;background:#ffffff08;border:1px solid #ffffff14;margin-bottom:8px;align-items:flex-start}.notification-row.unread{border-left:3px solid var(--green)}.notification-row p{margin:4px 0;color:#b4c3c8;font-size:13px}.tag-preview{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}@media(max-width:720px){.modal.wide{padding:14px}.library-layout{grid-template-columns:1fr}.library-side{display:flex;gap:5px;overflow:auto;border:0;border-bottom:1px solid #ffffff18;padding-bottom:8px}.library-side button{white-space:nowrap;width:auto}.media-grid{grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:8px}.media-art{height:115px}.profile-editor,.settings-grid,.community-grid{grid-template-columns:1fr}.field-group.full{grid-column:auto}.profile-hero{height:135px}.profile-avatar-large{width:68px;height:68px}.embed-frame{min <body>
<div class="shell" id="shell">
<video class="bg-video" id="bgVideo" autoplay muted loop playsinline poster="https://raw.githubusercontent.com/PedroWilsonRL/xboxone-dashboard/main/src/assets/game-list/game-background/Forza-Horizon-5.jpg"><source src="https://raw.githubusercontent.com/PedroWilsonRL/xboxone-dashboard/main/src/assets/Animated-Background/PlayStation%205%20-%20Menu%20Background%20with%20particles.mp4" type="video/mp4"></video>
<div class="bg-image" id="bgImage"></div><div class="bg-shade"></div>
<header class="topbar">
<button class="profile" id="profileButton" aria-label="Open profile"><span class="avatar">P</span><span><span class="user-name">Patrick_Mango</span><img class="user-logo" src="https://raw.githubusercontent.com/PedroWilsonRL/xboxone-dashboard/main/src/assets/Icons/logo%20ultimate.png" alt="Game Pass Ultimate"></span></button>
<nav class="top-icons" aria-label="Dashboard shortcuts">
<img class="top-icon" tabindex="0" role="button" data-shortcut="Home" src="https://raw.githubusercontent.com/PedroWilsonRL/xboxone-dashboard/main/src/assets/Icons/icon1.png" alt="Home" title="Home">
<img class="top-icon" tabindex="0" role="button" data-shortcut="Community" src="https://raw.githubusercontent.com/PedroWilsonRL/xboxone-dashboard/main/src/assets/Icons/icon2.png" alt="Community" title="Community">
<img class="top-icon" tabindex="0" role="button" data-shortcut="Capture" src="https://raw.githubusercontent.com/PedroWilsonRL/xboxone-dashboard/main/src/assets/Icons/icon3.png" alt="Capture" title="Capture">
<img class="top-icon" tabindex="0" role="button" data-shortcut="Settings" src="https://raw.githubusercontent.com/PedroWilsonRL/xboxone-dashboard/main/src/assets/Icons/icon4.png" alt="Settings" title="Settings">
<img class="top-icon" tabindex="0" role="button" data-shortcut="Notifications" src="https://raw.githubusercontent.com/PedroWilsonRL/xboxone-dashboard/main/src/assets/Icons/icon5.png" alt="Notifications" title="Notifications">
</nav>
<div class="clock-area"><div class="clock-icons"><img src="https://raw.githubusercontent.com/PedroWilsonRL/xboxone-dashboard/main/src/assets/Icons/icon%20charging.png" alt="Battery"><img src="https://raw.githubusercontent.com/PedroWilsonRL/xboxone-dashboard/main/src/assets/Icons/microfone2.png" alt="Microphone"></div><div class="clock" id="clock">--:--</div></div>
</header>
<main class="content">
<div class="selection-label" id="selectionLabel"><div class="eyebrow" id="selectedType">Recently played</div><h1 id="selectedTitle">Forza Horizon 5</h1><p id="selectedDescription">Choose a game to preview its artwork.</p></div>

</div>
<script>
(()=> {
const base='https://raw.githubusercontent.com/PedroWilsonRL/xboxone-dashboard/main/src/assets/';
const cards=[...document.querySelectorAll('.game-card,.rectangle-card')];
const bg=document.getElementById('bgImage'),video=document.getElementById('bgVideo'),label=document.getElementById('selectionLabel');
const title=document.getElementById('selectedTitle'),desc=document.getElementById('selectedDescription'),type=document.getElementById('selectedType');
const toast=document.getElementById('toast');let selected=-1,toastTimer;
function showToast(message){toast.textContent=message;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1800)}
function selectCard(card,focus=false){const index=cards.indexOf(card);selected=index;cards.forEach(c=>c.classList.toggle('selected',c===card));const name=card.dataset.background;bg.style.backgroundImage='url("'+base+(card.classList.contains('game-card')?'game-list/game-background/':'')+encodeURIComponent(name).replace(/%2F/g,'/')+'")';bg.style.opacity='1';video.style.opacity='.06';title.textContent=card.dataset.title;desc.textContent=card.dataset.description;type.textContent=card.classList.contains('game-card')?'Recently played':'Dashboard';label.classList.add('visible');if(focus)card.focus({preventScroll:true});}
function clearSelection(){selected=-1;cards.forEach(c=>c.classList.remove('selected'));bg.style.opacity='0';video.style.opacity='.52';label.classList.remove('visible')}
cards.forEach((card,i)=>{card.addEventListener('click',e=>{e.stopPropagation();if(selected===i){selectCard(card)}else selectCard(card)});card.addEventListener('mouseenter',()=>{if(selected===-1){title.textContent=card.dataset.title;desc.textContent=card.dataset.description;type.textContent=card.classList.contains('game-card')?'Recently played':'Dashboard';label.classList.add('visible')}});card.addEventListener('focus',()=>{if(selected!==i)selectCard(card)})});
document.getElementById('shell').addEventListener('click',e=>{if(!e.target.closest('.game-card,.rectangle-card,.top-icon,.profile'))clearSelection()});
document.querySelectorAll('[data-shortcut]').forEach((icon,i)=>{const activate=()=>{document.querySelectorAll('.top-icon').forEach(x=>x.classList.remove('active'));icon.classList.add('active');showToast(({Home:'Home dashboard',Community:'Community is ready to connect',Capture:'Capture & share',Settings:'Dashboard settings',Notifications:'You’re all caught up'})[icon.dataset.shortcut]||icon.dataset.shortcut)};icon.addEventListener('click',activate);icon.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();activate()}})});
document.getElementById('profileButton').addEventListener('click',()=>showToast('Signed in as Patrick_Mango'));

const modalBackdrop=document.getElementById('modalBackdrop'),modalTitle=document.getElementById('modalTitle'),modalContent=document.getElementById('modalContent');
const profileButton=document.getElementById('profileButton'),controllerPill=document.getElementById('controllerPill');
const saved=(key,fallback)=>{try{return localStorage.getItem(key)||fallback}catch{return fallback}};
const save=(key,value)=>{try{localStorage.setItem(key,value)}catch{}};
let gamerTag=saved('mcx-gamertag','Patrick_Mango'),gamerScore=Number(saved('mcx-score','0'))||0;
let selectedCount=Number(saved('mcx-selected-count','0'))||0,unlocked=new Set(JSON.parse(saved('mcx-achievements','[]')));
function updateProfile(){const name=document.querySelector('.profile-name');if(name)name.textContent=gamerTag;const avatar=document.querySelector('.avatar');if(avatar)avatar.textContent=(gamerTag.trim()[0]||'P').toUpperCase()}
function openModal(mode='settings'){
 modalTitle.textContent=mode==='profile'?'Your Xbox profile':mode==='achievements'?'Achievements':'Dashboard settings';
 if(mode==='profile'){
 modalContent.innerHTML='<p>Personalize your local dashboard profile. These settings are saved in this browser.</p><label class="modal-label" for="gamerTagInput">Gamertag</label><input id="gamerTagInput" maxlength="18" value="'+escapeHtml(gamerTag)+'" autocomplete="off"><div class="setting-row"><div><strong>G-Score</strong><small>Earn points as you explore the dashboard.</small></div><span class="score">'+gamerScore+' G</span></div><div class="modal-actions"><button class="xbtn primary" id="saveProfile">Save profile</button><button class="xbtn" id="showAchievements">View achievements</button></div>';
 document.getElementById('saveProfile').onclick=()=>{const value=document.getElementById('gamerTagInput').value.trim();if(!value){showToast('Enter a gamertag first');return}gamerTag=value;save('mcx-gamertag',gamerTag);updateProfile();closeModal();showToast('Profile saved')};
 document.getElementById('showAchievements').onclick=()=>openModal('achievements');
 }else if(mode==='achievements'){
 const defs=[['first','First Steps','Select your first dashboard tile · +10 G'],['explorer','Explorer','Select 5 dashboard tiles · +25 G'],['collector','Dashboard Regular','Select 10 dashboard tiles · +50 G'],['controller','Controller Ready','Connect a game controller · +25 G']];
 modalContent.innerHTML='<p>Achievements are saved locally in this browser.</p><div class="setting-row"><div><strong>Total G-Score</strong><small>Your dashboard progress</small></div><span class="score">'+gamerScore+' G</span></div><div class="achievement-list">'+defs.map(d=>'<div class="achievement"><div class="achievement-icon">'+(unlocked.has(d[0])?'✓':'◇')+'</div><div><strong>'+d[1]+'</strong><small>'+d[2]+'</small></div><span style="margin-left:auto;color:'+(unlocked.has(d[0])?'var(--green2)':'#829096')+'">'+(unlocked.has(d[0])?'UNLOCKED':'LOCKED')+'</span></div>').join('')+'</div><div class="modal-actions"><button class="xbtn" id="backSettings">Back to settings</button></div>';
 document.getElementById('backSettings').onclick=()=>openModal('settings');
 }else{
 modalContent.innerHTML='<p>Make the dashboard feel like your own. Changes apply immediately.</p><div class="setting-row"><div><strong>Dashboard theme</strong><small>Choose the accent color</small></div><select id="accentChoice" aria-label="Accent color"><option value="green">Xbox green</option><option value="blue">Electric blue</option><option value="purple">Neon purple</option></select></div><div class="setting-row"><div><strong>Motion effects</strong><small>Tile lift and transitions</small></div><input id="motionChoice" type="checkbox" style="width:20px;height:20px;accent-color:#20d46b"></div><div class="setting-row"><div><strong>Controller support</strong><small>Gamepad works when connected to this browser</small></div><span class="score" id="controllerStatus">Searching…</span></div><div class="modal-actions"><button class="xbtn primary" id="saveSettings">Save settings</button><button class="xbtn" id="openAchievements">Achievements</button><button class="xbtn" id="openProfile">Edit profile</button></div>';
 const accent=document.getElementById('accentChoice');accent.value=saved('mcx-accent','green');accent.onchange=()=>applyAccent(accent.value);
 const motion=document.getElementById('motionChoice');motion.checked=saved('mcx-motion','on')!=='off';
 document.getElementById('saveSettings').onclick=()=>{save('mcx-accent',accent.value);applyAccent(accent.value);save('mcx-motion',motion.checked?'on':'off');document.body.classList.toggle('reduce-dashboard-motion',!motion.checked);closeModal();showToast('Settings saved')};
 document.getElementById('openAchievements').onclick=()=>openModal('achievements');document.getElementById('openProfile').onclick=()=>openModal('profile');
 }
 modalBackdrop.classList.add('open');modalBackdrop.setAttribute('aria-hidden','false');
 const first=modalContent.querySelector('input,button,select');if(first)first.focus({preventScroll:true});
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function closeModal(){modalBackdrop.classList.remove('open');modalBackdrop.setAttribute('aria-hidden','true')}
function applyAccent(v){const colors={green:['#20d46b','#3bf18a'],blue:['#299cff','#72c3ff'],purple:['#a66cff','#d0aaff']};const c=colors[v]||colors.green;document.documentElement.style.setProperty('--green',c[0]);document.documentElement.style.setProperty('--green2',c[1]);document.documentElement.style.setProperty('--focus',c[1])}
function unlockAchievement(id,name,points){if(unlocked.has(id))return;unlocked.add(id);gamerScore+=points;save('mcx-achievements',JSON.stringify([...unlocked]));save('mcx-score',String(gamerScore));showToast('🏆 Achievement unlocked: '+name+' · +'+points+' G');}
function handleTileProgress(){selectedCount++;save('mcx-selected-count',String(selectedCount));if(selectedCount>=1)unlockAchievement('first','First Steps',10);if(selectedCount>=5)unlockAchievement('explorer','Explorer',25);if(selectedCount>=10)unlockAchievement('collector','Dashboard Regular',50)}
function updateProfileButton(){const b=document.getElementById('profileButton');if(b)b.setAttribute('aria-label','Open profile for '+gamerTag)}
profileButton.addEventListener('click',()=>openModal('profile'));
document.getElementById('modalClose').addEventListener('click',closeModal);
modalBackdrop.addEventListener('click',e=>{if(e.target===modalBackdrop)closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalBackdrop.classList.contains('open')){closeModal();e.stopImmediatePropagation()}});
document.querySelector('[data-shortcut="Settings"]')?.addEventListener('click',()=>openModal('settings'));
document.querySelector('[data-shortcut="Notifications"]')?.addEventListener('click',()=>openModal('achievements'));
updateProfile();updateProfileButton();applyAccent(saved('mcx-accent','green'));if(saved('mcx-motion','on')==='off')document.body.classList.add('reduce-dashboard-motion');
const originalSelectCard=selectCard;
selectCard=function(card,focus=false){const changed=cards.indexOf(card)!==selected;originalSelectCard(card,focus);if(changed)handleTileProgress()};
function getPads(){try{return [...(navigator.getGamepads?navigator.getGamepads():[])].filter(Boolean)}catch{return []}}
let lastPadButtons=[],lastAxisMove=0,hadPad=false;
function gamepadFrame(){
 const pads=getPads(),pad=pads.find(p=>p.connected);
 if(pad){controllerPill.classList.add('show');if(!hadPad){hadPad=true;showToast('🎮 Controller connected');unlockAchievement('controller','Controller Ready',25)}
 const now=performance.now(),pressed=i=>!!pad.buttons[i]?.pressed;
 const edge=i=>pressed(i)&&!lastPadButtons[i];
 if(now-lastAxisMove>190){
 let dx=0,dy=0;
 if(pressed(14)||pad.axes[0]<-.55)dx=-1;else if(pressed(15)||pad.axes[0]>.55)dx=1;
 if(pressed(12)||pad.axes[1]<-.55)dy=-1;else if(pressed(13)||pad.axes[1]>.55)dy=1;
 if(dx||dy){let n=selected<0?0:selected;const cols=9;if(dx)n=Math.max(0,Math.min(cards.length-1,n+dx));if(dy)n=Math.max(0,Math.min(cards.length-1,n+dy*cols));selectCard(cards[n],true);lastAxisMove=now}
 }
 if(edge(0)){if(modalBackdrop.classList.contains('open')){const active=document.activeElement;if(active?.tagName==='BUTTON')active.click();else if(active?.tagName==='INPUT')active.blur()}else if(selected>=0)selectCard(cards[selected])}
 if(edge(1)){if(modalBackdrop.classList.contains('open'))closeModal();else clearSelection()}
 if(edge(9)){if(modalBackdrop.classList.contains('open'))closeModal();else openModal('settings')}
 lastPadButtons=pad.buttons.map(b=>!!b.pressed);
 }else{controllerPill.classList.remove('show');hadPad=false;lastPadButtons=[]}
 requestAnimationFrame(gamepadFrame)
}
if('getGamepads'in navigator)requestAnimationFrame(gamepadFrame);

function updateClock(){document.getElementById('clock').textContent=new Intl.DateTimeFormat(undefined,{hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date())}updateClock();setInterval(updateClock,15000);
document.addEventListener('keydown',e=>{if(modalBackdrop.classList.contains('open'))return;const active=document.activeElement;const arrows=['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'];if(arrows.includes(e.key)){e.preventDefault();let next=selected<0?0:selected;if(e.key==='ArrowLeft')next=Math.max(0,next-1);if(e.key==='ArrowRight')next=Math.min(cards.length-1,next+1);if(e.key==='ArrowUp')next=Math.max(0,next-9);if(e.key==='ArrowDown')next=Math.min(cards.length-1,next+9);selectCard(cards[next],true)}if(e.key==='Escape'||e.key.toLowerCase()==='b'){clearSelection()}if(e.key==='Enter'&&(active.classList.contains('game-card')||active.classList.contains('rectangle-card'))){selectCard(active)}if(e.key.toLowerCase()==='a'&&selected>=0)selectCard(cards[selected])});
const dot=document.getElementById('cursorDot');document.addEventListener('mousemove',e=>{dot.style.left=e.clientX+'px';dot.style.top=e.clientY+'px';dot.style.opacity='1'});document.addEventListener('mouseleave',()=>dot.style.opacity='0');document.addEventListener('mousedown',()=>dot.style.transform='translate(-50%,-50%) scale(.78)');document.addEventListener('mouseup',()=>dot.style.transform='translate(-50%,-50%) scale(1)');
document.querySelectorAll('img').forEach(img=>img.addEventListener('error',()=>{if(img.classList.contains('top-icon'))img.style.display='none'}));

const pg={type:'games',search:'',sort:'featured',filter:'all'};
const games=[{id:'snake',title:'Neon Snake Demo',icon:'🐍',genre:'Arcade',desc:'Playable snake game; use arrow keys or WASD.',demo:'snake'},{id:'reaction',title:'Reaction Lab',icon:'⚡',genre:'Arcade',desc:'Hit the target ten times as quickly as you can.',demo:'reaction'},{id:'2048',title:'2048 Mini',icon:'🔢',genre:'Puzzle',desc:'Merge matching tiles using arrow keys.',demo:'2048'},{id:'forza',title:'Forza Horizon 5',art:'Forza-Horizon-5.jpg',icon:'🏎️',genre:'Racing',desc:'Official Forza Horizon website.',url:'https://forza.net/horizon'},{id:'halo',title:'Halo 5: Guardians',art:'Halo-5-Guardians.jpg',icon:'🛡️',genre:'Action',desc:'Official Halo website.',url:'https://www.halowaypoint.com'},{id:'minecraft',title:'Minecraft',art:'Minecraft.jpg',icon:'🧱',genre:'Sandbox',desc:'Official Minecraft website.',url:'https://www.minecraft.net'},{id:'gta',title:'Grand Theft Auto V',art:'Grand-Theft-Auto-V.jpg',icon:'🌆',genre:'Open world',desc:'Official Rockstar Games page.',url:'https://www.rockstargames.com/gta-v'},{id:'souls',title:'Dark Souls III',art:'Dark-Souls-III-Deluxe-Edition.jpg',icon:'🔥',genre:'RPG',desc:'Official publisher website.',url:'https://www.bandainamcoent.com/games/dark-souls-iii'},{id:'witcher',title:'The Witcher 3',art:'The-Witcher-3-Complete-Edition.jpg',icon:'🐺',genre:'RPG',desc:'Official Witcher website.',url:'https://www.thewitcher.com/us/en/witcher3'},{id:'paladins',title:'Paladins',art:'Paladins.jpg',icon:'✨',genre:'Action',desc:'Official Paladins website.',url:'https://www.paladins.com'}];
const movies=[{id:'bbb',title:'Big Buck Bunny',icon:'🐰',genre:'Animation',desc:'Open animated short from Blender Open Movies.',video:'https://storage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4',url:'https://peach.blender.org/'},{id:'elephants',title:'Elephants Dream',icon:'🐘',genre:'Sci-fi animation',desc:'Experimental short from Blender Open Movies.',video:'https://storage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4',url:'https://orange.blender.org/'},{id:'sintel',title:'Sintel Trailer',icon:'🐉',genre:'Fantasy',desc:'Animated fantasy short trailer.',video:'https://media.w3.org/2010/05/sintel/trailer.mp4',url:'https://durian.blender.org/'},{id:'sample',title:'Video Player Test',icon:'🎬',genre:'Demo clip',desc:'Public sample clip for testing the player.',video:'https://media.w3.org/2010/05/video/movie_300.mp4',url:'https://www.w3.org/'}];
const apps=[{id:'notes',title:'Quick Notes',icon:'📝',genre:'Productivity',desc:'A notes pad saved in this browser.',demo:'notes'},{id:'paint',title:'Pixel Studio',icon:'🎨',genre:'Creative',desc:'Draw and download your artwork.',demo:'paint'},{id:'timer',title:'Focus Timer',icon:'⏱️',genre:'Utility',desc:'Start, pause, and reset a focus timer.',demo:'timer'},{id:'youtube',title:'YouTube',icon:'▶️',genre:'Video',desc:'Open the official YouTube website.',url:'https://www.youtube.com'},{id:'spotify',title:'Spotify Web Player',icon:'🎵',genre:'Music',desc:'Open the official Spotify web player.',url:'https://open.spotify.com'},{id:'twitch',title:'Twitch',icon:'🟣',genre:'Streaming',desc:'Open Twitch to browse live streams.',url:'https://www.twitch.tv'},{id:'roblox',title:'Roblox',icon:'🟥',genre:'Games platform',desc:'Open the official Roblox website.',url:'https://www.roblox.com'}];
function jget(k,d){try{return JSON.parse(saved(k,JSON.stringify(d)))}catch{return d}}
function prof(){return{name:saved('mcx-gamertag','Patrick_Mango'),bio:saved('mcx-bio','Building my own corner of the internet.'),tags:jget('mcx-game-tags',['Minecraft','Fortnite','Roblox']),status:saved('mcx-status','Online'),avatar:saved('mcx-avatar',''),banner:saved('mcx-banner','')}}
function profileVisual(){const p=prof(),a=document.querySelector('.avatar'),n=document.querySelector('.user-name');if(n)n.textContent=p.name;if(a){a.style.backgroundImage=p.avatar?'url("'+p.avatar+'")':'';a.style.backgroundSize='cover';a.style.backgroundPosition='center';a.textContent=p.avatar?'':(p.name[0]||'P')}}
function ph(t,s,a){return '<div class="page-heading"><div><h3>'+escapeHtml(t)+'</h3><p class="page-subtitle">'+escapeHtml(s)+'</p></div>'+(a||'')+'</div>'}
function page(p,o){o=o||{};closeModal();modalBackdrop.classList.add('open');modalBackdrop.setAttribute('aria-hidden','false');modalBackdrop.querySelector('.modal').classList.add('wide');document.querySelectorAll('.top-icon').forEach(i=>i.classList.toggle('active',i.dataset.shortcut===({home:'Home',community:'Community',capture:'Capture',settings:'Settings',notifications:'Notifications'}[p]||'')));if(p==='home'){modalBackdrop.classList.remove('open');modalBackdrop.querySelector('.modal').classList.remove('wide');return}if(p==='library'){pg.type=o.type||pg.type||'games';library();return}if(p==='profile')return profilePage();if(p==='settings')return settingsPage();if(p==='community')return communityPage();if(p==='capture')return capturePage();if(p==='notifications')return notificationsPage();if(p==='achievements')return achievementsPage()}

if(t==='snake')return '<html><head><style>'+c+'canvas{display:block;width:min(100%,520px);background:#06100d;margin:14px auto}</style></head><body><h2>🐍 Neon Snake</h2><p>Arrow keys or WASD move. Collect dots and avoid walls.</p><b id="s">Score: 0</b> <button id="r">Restart</button><canvas id="c" width="520" height="360"></canvas><script>const c=document.getElementById("c"),x=c.getContext("2d");let a,f,d,n,t;function reset(){clearInterval(t);a=[{x:8,y:8},{x:7,y:8},{x:6,y:8}];d={x:1,y:0};n=0;food();draw();t=setInterval(tick,120)}function food(){f={x:Math.floor(Math.random()*26),y:Math.floor(Math.random()*18)}}function draw(){x.fillStyle="#06100d";x.fillRect(0,0,520,360);a.forEach((p,i)=>{x.fillStyle=i?"#20d46b":"#b8ffd1";x.fillRect(p.x*20+2,p.y*20+2,16,16)});x.fillStyle="#f5ff75";x.fillRect(f.x*20+5,f.y*20+5,10,10);document.getElementById("s").textContent="Score: "+n}function tick(){let h={x:a[0].x+d.x,y:a[0].y+d.y};if(h.x<0||h.y<0||h.x>=26||h.y>=18||a.some(p=>p.x===h.x&&p.y===h.y)){clearInterval(t);x.fillStyle="white";x.font="bold 24px system-ui";x.fillText("Game over! "+n,160,180);return}a.unshift(h);if(h.x===f.x&&h.y===f.y){n++;food()}else a.pop();draw()}document.addEventListener("keydown",e=>{let v={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]}[e.key];if(v){e.preventDefault();if(v[0]!==-d.x||v[1]!==-d.y)d={x:v[0],y:v[1]}}});document.getElementById("r").onclick=reset;reset();<\\/script></body></html>';
